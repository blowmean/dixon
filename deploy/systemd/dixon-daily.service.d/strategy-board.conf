# Drop-in for the existing dixon-daily.service.
# Copy to ~/.config/systemd/user/dixon-daily.service.d/strategy-board.conf
#
# ExecStartPost runs only when the daily job exits 0. A partial ingest
# (exit 2) skips the board; run scripts/strategy_board.sh by hand if the
# bars that did land are enough.
#
#   systemctl --user daemon-reload

[Service]
ExecStartPost=/home/paul/project-dixon/scripts/strategy_board.sh
