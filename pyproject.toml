[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dixon"
version = "0.1.0"
description = "Project Dixon — personal HK+US equity market DB"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "duckdb>=1.1.0",
  "yfinance>=0.2.40",
  "pandas>=2.0.0",
  "numpy>=1.26.0",
  "fastapi>=0.110.0",
  "uvicorn[standard]>=0.27.0",
  "exchange-calendars>=4.5.0",
  "httpx>=0.27.0",
  "pydantic>=2.0.0",
  "python-dotenv>=1.0.0",
  "pyarrow>=15.0.0",
  "openpyxl>=3.1.0",
]

[project.scripts]
dixon-api = "dixon.api:main"
dixon-ingest = "dixon.ingest:main"
dixon-rollup = "dixon.rollup:main"
dixon-indicators = "dixon.compute_indicators:main"
dixon-refresh-universe = "dixon.refresh_universe:main"

[tool.setuptools.packages.find]
include = ["dixon*"]

[tool.setuptools.package-data]
dixon = ["static/*", "static/vendor/*"]
